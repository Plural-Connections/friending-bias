# Stage 0 — Data Assembly & Target Construction

paths:
  raw_atlas: data/raw/social_capital_atlas.csv
  raw_gs_reviews: data/raw/gs_reviews.csv
  raw_gs_ratings: data/raw/gs_ratings.csv
  raw_gs_demos: data/raw/gs_demos.csv
  nces_crosswalk: data/raw/nces_crosswalk.csv
  out_schools_master: data/processed/schools_master.parquet
  out_reviews_clean: data/interim/reviews_clean.parquet

# Research decision:
# no minimum-review-per-school threshold is applied. Reviews are concatenated
# per school (chronological order) rather than aggregated review-by-review.
aggregation:
  strategy: concatenate # options: concatenate | mean | max | pct_mentioning
  chronological: true
  review_cutoff_year: 2022 # post 2022 cutoff
  max_reviews_per_school: null # set an int cap if concatenation risks exceeding context limits
  dedup:
    enabled: true
    method: near_duplicate_text_similarity
    similarity_threshold: 0.9

qc:
  min_nces_match_rate: 0.90
