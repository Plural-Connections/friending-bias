# configs/concepts.yaml
#
# The concept scoring rubric. This is a research artifact, not a code config —
# version-control every change, and cite this file's git history in
# reports/stage3_concept_validation.md.
#
# Populate from Stage 2's topic catalog (BERTopic + gabriel.discover cross-check)
# plus theory-driven additions (e.g. explicit friend-group segregation language).
# Each concept needs: a plain-language definition and anchor examples at
# low/mid/high so the LLM scorer (and human labelers) apply it consistently.

scoring_scale: 0-5   # or 0-100 if using gabriel.rate

concepts:
  cliquishness:
    definition: >
      Review describes exclusive friend groups or social cliques that are
      difficult for other students to enter.
    anchors:
      0: "No mention of social groupings or exclusivity."
      2: "Passing mention of 'groups' or 'crowds' without strong exclusivity framing."
      5: "Explicit description of cliques, exclusion, or difficulty making friends across groups."

  diversity_climate:
    definition: >
      Review discusses racial/ethnic or socioeconomic diversity and inclusion
      at the school.
    anchors:
      0: "No mention of diversity or inclusion."
      2: "Neutral/factual mention of diverse student body."
      5: "Detailed discussion of how diversity is (or isn't) embraced in practice."

  tracking_segregation:
    definition: >
      Review mentions AP/honors tracking, academies, or course-level sorting
      as creating separation between groups of students.
    anchors:
      0: "No mention of tracking or course levels."
      2: "Mentions AP/honors courses exist, no comment on social effect."
      5: "Explicitly links tracking/course level to social separation."

  # Add remaining 12-27 concepts from the Stage 2 catalog here.
  # Keep definitions short, specific, and non-overlapping — near-duplicate
  # concepts should be merged (see Stage 3 checklist: correlation matrix check).
